<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-clipboard-check me-2 text-primary"></i>Auditoria
        </h2>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/auditoria}">
        <div class="col-auto">
            <select name="entidade" class="form-select">
                <option value="">Todas as entidades</option>
                <option value="PEDIDO">Pedidos</option>
                <option value="CLIENTE">Clientes</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="entidadeId" class="form-control" placeholder="ID da entidade">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data e hora</th>
                        <th>Usuário</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Alterações</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(eventos)}">
                        <td colspan="6" class="text-center text-muted py-5">Nenhum registro de auditoria.</td>
                    </tr>
                    <tr th:each="e : ${eventos}">
                        <td class="ps-4 small" th:text="${#temporals.format(e.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:text="${e.usuario}"></span>
                            <span class="badge bg-secondary" th:text="${e.perfil}"></span>
                        </td>
                        <td th:text="${e.operacao}"></td>
                        <td class="small">
                            <span th:text="${e.entidade}"></span><br>
                            <span class="text-muted" th:text="${e.entidadeId}"></span>
                        </td>
                        <td class="small">
                            <div th:each="a : ${e.alteracoes}">
                                <strong th:text="${a.campo}"></strong>:
                                <span class="text-muted" th:text="${a.anterior != null ? a.anterior : '—'}"></span>
                                &rarr;
                                <span th:text="${a.novo != null ? a.novo : '—'}"></span>
                            </div>
                        </td>
                        <td class="small" th:text="${e.justificativa}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small">Exibindo até os 200 registros mais recentes. Telefones são mascarados.</div>
    </div>

</div>

</body>
</html>
