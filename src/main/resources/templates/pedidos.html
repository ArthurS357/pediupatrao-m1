<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary" sec:authorize="hasAnyRole('ATENDENTE','GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Cliente</th>
                        <th>Tipo</th>
                        <th>Itens</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Saída</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4">
                            <span th:text="${nomesClientes.getOrDefault(pedido.clienteId, pedido.clienteId)}"></span>
                        </td>
                        <td th:text="${pedido.tipoEntrega}"></td>
                        <td>
                            <div th:each="item : ${pedido.itens}" class="small">
                                <span th:text="${item.quantidade} + 'x ' + ${item.nome}"></span>
                            </div>
                        </td>
                        <td th:text="${pedido.descontoPercentual} + '%'"></td>
                        <td th:text="'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status.name() == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status.name() == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status.name() == 'EM_PREPARACAO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                            <div class="small text-danger" th:if="${pedido.justificativaCancelamento != null}"
                                 th:text="${pedido.justificativaCancelamento}"></div>
                        </td>
                        <td class="small">
                            <span th:text="${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')}"></span><br>
                            <span class="text-muted" th:text="${pedido.criadoPor}"></span>
                        </td>
                        <td class="small">
                            <th:block th:if="${pedido.saidaEm != null}">
                                <span th:text="${#temporals.format(pedido.saidaEm, 'dd/MM/yyyy HH:mm')}"></span><br>
                                <span class="text-muted" th:text="${pedido.saidaPor}"></span>
                            </th:block>
                        </td>
                        <td class="text-end pe-4">
                            <!-- Botoes so para GERENTE; a regra real esta no backend (SecurityConfig + service) -->
                            <th:block sec:authorize="hasRole('GERENTE')">
                                <button th:each="prox : ${pedido.proximosStatus}" type="button"
                                        class="btn btn-sm btn-outline-primary me-1"
                                        data-acao="status" th:data-id="${pedido.id}" th:data-status="${prox}"
                                        th:text="${prox}"></button>
                                <button th:if="${pedido.aceitaDescontoOuCancelamento}" type="button"
                                        class="btn btn-sm btn-outline-success me-1"
                                        data-acao="desconto" th:data-id="${pedido.id}">Desconto</button>
                                <button th:if="${pedido.aceitaDescontoOuCancelamento}" type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        data-acao="cancelar" th:data-id="${pedido.id}">Cancelar</button>
                            </th:block>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        async function chamar(url, opcoes) {
            const resposta = await fetch(url, opcoes);
            if (resposta.ok) {
                location.reload();
                return;
            }
            const problema = await resposta.json().catch(() => ({}));
            const erros = (problema.errors || []).map(e => e.message).join('\n');
            alert(problema.detail || erros || ('Erro ' + resposta.status));
        }

        const json = (corpo) => ({
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(corpo)
        });

        document.addEventListener('click', (evento) => {
            const botao = evento.target.closest('button[data-acao]');
            if (!botao) return;
            const id = botao.dataset.id;

            if (botao.dataset.acao === 'status') {
                chamar(`/api/pedidos/${id}/status?status=${botao.dataset.status}`, { method: 'PUT' });
            } else if (botao.dataset.acao === 'desconto') {
                const texto = prompt('Desconto em % (maior que 0 e no máximo 20):');
                if (texto === null) return;
                chamar(`/api/pedidos/${id}/desconto`, json({ percentual: texto.replace(',', '.') }));
            } else if (botao.dataset.acao === 'cancelar') {
                const justificativa = prompt('Justificativa do cancelamento:');
                if (justificativa === null) return;
                chamar(`/api/pedidos/${id}/cancelamento`, json({ justificativa }));
            }
        });
    </script>

</div>

</body>
</html>
