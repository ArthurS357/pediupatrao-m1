# MongoDB: a URI vem da variavel de ambiente SPRING_DATA_MONGODB_URI (nunca versionar credenciais aqui).
spring.data.mongodb.database=pizzaria
# 8080 fica ocupada pelo Steam nesta maquina
server.port=8081

# Senhas do seed inicial (DataInitializer) vem de APP_SEED_ADMIN_PASSWORD,
# APP_SEED_GERENTE_PASSWORD e APP_SEED_ATENDENTE_PASSWORD; sem a variavel, o usuario nao e criado.

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

logging.level.com.atrah=DEBUG

# OpenAPI (/v3/api-docs) e Swagger UI (/swagger-ui.html) documentam so a API do dashboard; exigem login.
springdoc.paths-to-match=/api/dashboard/**
